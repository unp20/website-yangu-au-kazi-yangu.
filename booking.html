<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD2YtPFL2L_ZwAKdSYpXtvLt8gJUm2IX6s",
    authDomain: "unptours.firebaseapp.com",
    projectId: "unptours",
    storageBucket: "unptours.firebasestorage.app",
    messagingSenderId: "233326851661",
    appId: "1:233326851661:web:354156110a5cee29904e04",
    measurementId: "G-5QJ1X38ZLC"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // MENU TOGGLE
  const menuToggleBtn = document.getElementById('menuToggleBtn');
  const navLinks = document.getElementById('navLinks');
  if(menuToggleBtn) {
      menuToggleBtn.addEventListener('click', () => {
          navLinks.classList.toggle('active');
      });
  }

  // BOOKING FORM LOGIC
  const bookingForm = document.getElementById('bookingForm');
  bookingForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const packageType = document.querySelector('input[name="package"]:checked').value;
      const name = document.getElementById('guestName').value;
      const contact = document.getElementById('guestContact').value;
      const country = document.getElementById('guestCountry').value;
      const date = document.getElementById('guestDate').value;
      const count = document.getElementById('guestCount').value;
      const hotel = document.getElementById('guestHotel').value;
      const notes = document.getElementById('guestNotes').value;

      try {
          // Hifadhi booking kwenye Firestore
          await addDoc(collection(db, "bookings"), {
              package: packageType,
              name: name,
              contact: contact,
              country: country,
              date: date,
              guests: count,
              hotel: hotel,
              notes: notes,
              status: "Inasubiri",
              createdAt: new Date()
          });

          // Tengeneza ujumbe wa WhatsApp
          const message = `*UNP TOURS BOOKING REQUEST*%0A%0A*Package:* ${packageType}%0A*Name:* ${name}%0A*Contact:* ${contact}%0A*Country:* ${country}%0A*Date:* ${date}%0A*Guests:* ${count}%0A*Hotel:* ${hotel}%0A*Notes:* ${notes}`;
          
          const whatsappUrl = `https://wa.me/255655728982?text=${message}`;
          window.open(whatsappUrl, '_blank');
          
          alert("Booking yako imetumwa kwa mafanikio! Tutakujibu hivi karibuni.");
      } catch (error) {
          console.error("Error: ", error);
          alert("Kuna hitilafu imetokea: " + error.message);
      }
  });

  // WEKA TAREHE YA LEO KAMA DEFAULT
  const dateInput = document.getElementById('guestDate');
  const today = new Date().toISOString().split('T')[0];
  dateInput.setAttribute('min', today);
</script>
