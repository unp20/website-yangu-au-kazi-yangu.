<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Your Trip — UNP TOURS Zanzibar</title>
<meta name="description" content="Book your Zanzibar excursion or Africa safari with UNP TOURS.">
<meta name="robots" content="index, follow">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c4a6e">
<link rel="icon" type="image/png" href="assets/images/logo.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCe5-MZMASwDZtIN3zfLvwlrn0U2ObC17s",
    authDomain: "soul-unp-tour.firebaseapp.com",
    projectId: "soul-unp-tour",
    storageBucket: "soul-unp-tour.firebasestorage.app",
    messagingSenderId: "503119437259",
    appId: "1:503119437259:web:aaa65be89a8d77d5abaa4e",
    measurementId: "G-EC65GSRRKM"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let allTrips = [];

  // ==================== LOAD TRIPS INTO DROPDOWN ====================
  async function loadTrips() {
    try {
      const snap = await getDocs(collection(db, "trips"));
      allTrips = [];
      snap.forEach((d) => allTrips.push({ id: d.id, ...d.data() }));

      const select = document.getElementById('tripSelect');
      select.innerHTML = '<option value="">-- Select a Trip --</option>';
      allTrips.forEach(t => {
        select.innerHTML += `<option value="${t.name}">${t.name} — ${t.location || 'Zanzibar'}</option>`;
      });

      // Check URL param
      const urlParams = new URLSearchParams(window.location.search);
      const preselect = urlParams.get('trip');
      if (preselect) select.value = preselect;

    } catch (error) {
      console.error(error);
    }
  }

  // ==================== SUBMIT BOOKING ====================
  window.submitBooking = async function(event) {
    event.preventDefault();

    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('message');

    const name = document.getElementById('customerName').value.trim();
    const email = document.getElementById('customerEmail').value.trim();
    const phone = document.getElementById('customerPhone').value.trim();
    const country = document.getElementById('customerCountry').value.trim();
    const tripName = document.getElementById('tripSelect').value;
    const tier = document.getElementById('tierSelect').value;
    const date = document.getElementById('travelDate').value;
    const guests = document.getElementById('guestsCount').value;
    const notes = document.getElementById('notes').value.trim();

    if (!name || !email || !phone || !tripName || !date) {
      showMsg('Please fill all required fields.', 'error');
      return;
    }

    // Pata bei kutoka kwenye trip
    const trip = allTrips.find(t => t.name === tripName);
    let amount = 0;
    if (trip) {
      if (tier === 'Budget') amount = trip.priceBudget || 0;
      else if (tier === 'Mid') amount = trip.priceMid || 0;
      else if (tier === 'Luxury') amount = trip.priceLuxury || 0;
    }

    btn.disabled = true;
    btn.textContent = 'Submitting...';
    msg.style.display = 'none';

    try {
      await addDoc(collection(db, "bookings"), {
        customer_name: name,
        customer_email: email,
        customer_phone: phone,
        customer_country: country,
        service_name: tripName,
        tier: tier,
        amount: amount,
        date: date,
        guests: guests,
        notes: notes,
        status: 'pending',
        partner_uid: 'unp-tours',
        partner_name: 'UNP Tours',
        created_at: serverTimestamp()
      });

      showMsg('✅ Booking submitted! We will contact you via WhatsApp shortly.', 'success');
      document.getElementById('bookingForm').reset();

      // Fungua WhatsApp
      setTimeout(() => {
        const waMsg = `🌸 *New Booking - UNP TOURS*%0A%0A` +
          `*Name:* ${encodeURIComponent(name)}%0A` +
          `*Email:* ${encodeURIComponent(email)}%0A` +
          `*Phone:* ${encodeURIComponent(phone)}%0A` +
          `*Country:* ${encodeURIComponent(country)}%0A` +
          `*Trip:* ${encodeURIComponent(tripName)}%0A` +
          `*Tier:* ${encodeURIComponent(tier)}%0A` +
          `*Amount:* $${amount}%0A` +
          `*Date:* ${encodeURIComponent(date)}%0A` +
          `*Guests:* ${encodeURIComponent(guests)}%0A` +
          `*Notes:* ${encodeURIComponent(notes || 'None')}`;
        window.open('https://wa.me/255655728982?text=' + waMsg, '_blank');
      }, 1500);

    } catch (error) {
      console.error(error);
      showMsg('Error: ' + error.message, 'error');
    }

    btn.disabled = false;
    btn.textContent = 'Submit Booking';
  };

  function showMsg(text, type) {
    const msg = document.getElementById('message');
    msg.style.display = 'block';
    if (type === 'error') {
      msg.style.background = '#fee2e2';
      msg.style.color = '#991b1b';
    } else {
      msg.style.background = '#d1fae5';
      msg.style.color = '#065f46';
    }
    msg.textContent = text;
  }

  window.addEventListener('load', loadTrips);
</script>

<style>
  body { font-family: 'Inter', sans-serif; background: #f8f9fa; }
  .input-field:focus {
    border-color: #d4a017;
    box-shadow: 0 0 0 4px rgba(212, 160, 23, 0.15);
  }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="fixed top-0 w-full flex justify-between items-center px-5 md:px-12 py-3 z-50 bg-[#0c4a6e] shadow-lg">
  <a href="index.html" class="flex items-center gap-3">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10">
      <circle cx="100" cy="100" r="95" fill="#0b3d2e" stroke="#d4a017" stroke-width="4"/>
      <text x="100" y="140" font-family="Inter" font-size="30" font-weight="800" fill="#d4a017" text-anchor="middle">UNP</text>
    </svg>
    <span class="font-extrabold text-white hidden sm:block">UNP TOURS</span>
  </a>
  <a href="index.html" class="text-white font-semibold hover:text-[#d4a017] transition">← Back to Home</a>
</nav>

<!-- HERO -->
<section class="pt-32 pb-16 bg-gradient-to-br from-[#0c4a6e] to-[#082f49] text-white">
  <div class="max-w-4xl mx-auto text-center px-5">
    <h1 class="text-4xl md:text-6xl font-extrabold mb-4">Book Your Trip</h1>
    <p class="text-lg md:text-xl text-blue-200">Fill in the form and we will contact you via WhatsApp.</p>
  </div>
</section>

<!-- FORM -->
<main class="max-w-3xl mx-auto px-5 py-12">

  <form id="bookingForm" onsubmit="submitBooking(event)" class="bg-white rounded-2xl p-6 md:p-8 shadow-xl space-y-5 border-2 border-[#d4a017]">

    <h2 class="text-2xl font-extrabold text-[#082f49] text-center mb-6">🌸 Booking Form</h2>

    <!-- Name -->
    <div>
      <label class="block text-sm font-semibold text-[#082f49] mb-2">Full Name *</label>
      <input type="text" id="customerName" required placeholder="John Doe" class="input-field w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none transition">
    </div>

    <!-- Email + Phone -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-[#082f49] mb-2">Email *</label>
        <input type="email" id="customerEmail" required placeholder="john@example.com" class="input-field w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none transition">
      </div>
      <div>
        <label class="block text-sm font-semibold text-[#082f49] mb-2">Phone / WhatsApp *</label>
        <input type="tel" id="customerPhone" required placeholder="+255 712 345 678" class="input-field w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none transition">
      </div>
    </div>

    <!-- Country -->
    <div>
      <label class="block text-sm font-semibold text-[#082f49] mb-2">Country</label>
      <input type="text" id="customerCountry" placeholder="Tanzania" class="input-field w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none transition">
    </div>

    <!-- Trip -->
    <div>
      <label class="block text-sm font-semibold text-[#082f49] mb-2">Select Trip *</label>
      <select id="tripSelect" required class="input-field w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none transition bg-white">
        <option value="">Loading trips...</option>
      </select>
    </div>

    <!-- Tier + Date -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-[#082f49] mb-2">Package Tier *</label>
        <select id="tierSelect" required class="input-field w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none transition bg-white">
          <option value="Budget">Budget</option>
          <option value="Mid" selected>Mid</option>
          <option value="Luxury">Luxury</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold text-[#082f49] mb-2">Travel Date *</label>
        <input type="date" id="travelDate" required class="input-field w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none transition">
      </div>
    </div>

    <!-- Guests -->
    <div>
      <label class="block text-sm font-semibold text-[#082f49] mb-2">Number of Guests *</label>
      <input type="number" id="guestsCount" required min="1" value="2" class="input-field w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none transition">
    </div>

    <!-- Notes -->
    <div>
      <label class="block text-sm font-semibold text-[#082f49] mb-2">Special Requests</label>
      <textarea id="notes" rows="3" placeholder="Any special requests..." class="input-field w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none transition"></textarea>
    </div>

    <!-- Submit -->
    <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-[#d4a017] to-[#b88a10] text-[#082f49] py-4 rounded-xl font-bold text-lg hover:shadow-lg transition">
      Submit Booking
    </button>

    <div id="message" style="display:none;" class="p-4 rounded-xl text-sm font-semibold text-center"></div>

  </form>

</main>

<!-- FOOTER -->
<footer class="bg-black text-gray-300 py-10 px-5 border-t-4 border-[#d4a017]">
  <div class="max-w-4xl mx-auto text-center">
    <p class="font-bold text-[#d4a017] mb-2">UNP TOURS — Unique & Natural Paradise</p>
    <p class="text-sm">Nungwi, Zanzibar, Tanzania | WhatsApp: +255 655 728 982</p>
    <p class="text-xs mt-4 text-gray-500">© 2026 UNP Tours. All rights reserved.</p>
  </div>
</footer>

<!-- WhatsApp Float -->
<a href="https://wa.me/255655728982" target="_blank" class="fixed bottom-6 right-6 w-14 h-14 bg-[#25D366] rounded-full flex justify-center items-center text-3xl text-white shadow-lg hover:scale-110 transition z-50">
  💬
</a>

</body>
</html>
