<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog | UNP Tours</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
    .page-header {
        text-align: center;
        padding: 120px 20px 40px;
        background: linear-gradient(135deg, #1a3c34, #2c5e4f);
        color: white;
    }
    .page-header h1 { font-size: 2.5rem; margin-bottom: 10px; }
    .page-header p { font-size: 1.1rem; max-width: 600px; margin: 0 auto; }
    .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
    .blog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }
    .blog-card {
        background: white; border-radius: 15px; overflow: hidden;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        transition: transform 0.3s, box-shadow 0.3s;
        display: flex; flex-direction: column;
    }
    .blog-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.15); }
    .blog-card img { width: 100%; height: 200px; object-fit: cover; display: block; }
    .blog-card .img-fallback {
        width: 100%; height: 200px; background: #eee; display: flex;
        align-items: center; justify-content: center; color: #888;
    }
    .blog-card .card-body { padding: 25px; flex: 1; display: flex; flex-direction: column; }
    .blog-card .category {
        display: inline-block; background: #c5a059; color: #1a3c34;
        padding: 4px 12px; border-radius: 20px; font-size: 0.75rem;
        font-weight: 700; text-transform: uppercase; margin-bottom: 12px; width: fit-content;
    }
    .blog-card h3 { color: #1a3c34; font-size: 1.3rem; margin-bottom: 10px; }
    .blog-card .meta { color: #888; font-size: 0.8rem; margin-bottom: 12px; }
    .blog-card p { color: #555; font-size: 0.9rem; line-height: 1.6; margin-bottom: 20px; flex: 1; }
    .blog-card .btn-read {
        display: inline-block; padding: 10px 20px; background: #1a3c34;
        color: white; text-decoration: none; border-radius: 8px;
        font-weight: 600; font-size: 0.9rem; transition: background 0.3s; text-align: center;
    }
    .blog-card .btn-read:hover { background: #c5a059; color: #1a3c34; }
</style>
</head>
<body>

<header class="header" style="position: fixed; top: 0; width: 100%; z-index: 1000;">
<div class="nav-container">
<a href="index.html" class="logo-area">
<div class="logo-text"><h2>UNP TOURS</h2><span>Unique & Natural Paradise</span></div>
</a>
</div>
</header>

<div class="page-header">
    <h1>Blogu Yetu</h1>
    <p>Makala kuhusu Zanzibar, Tanzania, safari, na utamaduni wetu.</p>
</div>

<div class="container">
    <div class="blog-grid" id="blogGrid">
        <p>Inapakia makala...</p>
    </div>
</div>

<script>
    // Orodha ya makala (unaweza kuongeza nyingine)
    const articles = [
        {
            id: 1,
            title: "Uzuri wa Zanzibar: Kisiwa cha Viungo",
            category: "Zanzibar",
            date: "Septemba 2026",
            author: "Salim Nasoro",
            image: "zanzibar-tours.jpg",
            excerpt: "Zanzibar ni kisiwa chenye historia tajiri, fukwe nzuri, na viungo vya kipekee. Soma makala hii kujua zaidi kuhusu uzuri wa kisiwa hiki."
        },
        {
            id: 2,
            title: "Safari ya Wanyama Porii: Serengeti na Ngorongoro",
            category: "Safari",
            date: "Septemba 2026",
            author: "Amina Hassan",
            image: "tanzania-safari.jpg",
            excerpt: "Kama unataka kuona wanyama pori kwa karibu, Serengeti na Ngorongoro ni sehemu bora. Soma makala hii kujua safari hizi."
        },
        {
            id: 3,
            title: "Utamaduni wa Wazanzibari: Mila na Desturi",
            category: "Utamaduni",
            date: "Agosti 2026",
            author: "Juma Ali",
            image: "city-tour.jpg",
            excerpt: "Wazanzibari wana utamaduni tajiri wa Kiarabu, Kiafrika, na Kihindi. Soma kuhusu mila na desturi zao za kipekee."
        },
        {
            id: 4,
            title: "Sanaa za Mikono: Banana Leaf Artwork",
            category: "Sanaa",
            date: "Agosti 2026",
            author: "Fatma Said",
            image: "handmade-art.jpg",
            excerpt: "Sanaa za mikono zinazotengenezwa kwa majani ya ndizi ni moja ya vivutio vya Zanzibar. Soma jinsi zinavyotengenezwa."
        },
        {
            id: 5,
            title: "Chakula cha Zanzibar: Ladha za Kipekee",
            category: "Chakula",
            date: "Julai 2026",
            author: "Salim Nasoro",
            image: "romantic-dinner.jpg.jpg",
            excerpt: "Chakula cha Zanzibar ni mchanganyiko wa ladha za Kiarabu, Kiafrika, na Kihindi. Soma kuhusu vyakula vya kipekee vya kisiwa hiki."
        },
        {
            id: 6,
            title: "Michezo ya Majini: Jet Ski na Drone Kayak",
            category: "Michezo",
            date: "Julai 2026",
            author: "Juma Ali",
            image: "jet-ski-water.jpg",
            excerpt: "Kama unapenda michezo ya majini, Zanzibar ni sehemu sahihi. Soma kuhusu Jet Ski, Jet Car, na Drone Kayak."
        }
    ];

    const blogGrid = document.getElementById('blogGrid');

    articles.forEach(article => {
        const card = document.createElement('div');
        card.className = 'blog-card';
        card.innerHTML = `
            <img src="${article.image}" alt="${article.title}" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\\'img-fallback\\'>${article.title}</div>';">
            <div class="card-body">
                <span class="category">${article.category}</span>
                <h3>${article.title}</h3>
                <p class="meta"><i class="fas fa-user"></i> ${article.author} • <i class="fas fa-calendar"></i> ${article.date}</p>
                <p>${article.excerpt}</p>
                <a href="#" class="btn-read" onclick="alert('Makala kamili inakuja hivi karibuni!'); return false;">Soma Zaidi <i class="fas fa-arrow-right"></i></a>
            </div>
        `;
        blogGrid.appendChild(card);
    });
</script>

</body>
  </html>
