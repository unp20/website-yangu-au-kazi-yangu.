<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNP Tours - Tanzania</title>
    <style>
        :root {
            --bc-purple: #4b0082;
            --bc-pink: #e31b6d;
            --text-dark: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
        }

        /* BRITISH COUNCIL EXACT HERO BANNER STYLE */
        .bc-hero-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 20px auto;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .bc-slide {
            display: none;
            position: relative;
            height: 400px;
        }

        .bc-slide.active {
            display: block;
        }

        /* Hapa ndipo utakapoweka picha zako. Majina ya picha yametolewa chini */
        .bc-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Vidoti vya juu kulia (Dots indicators kama British Council) */
        .bc-dots-top {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .bc-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffffff;
            opacity: 0.5;
            cursor: pointer;
            transition: 0.3s;
        }

        .bc-dot.active {
            opacity: 1;
            background: var(--bc-pink);
        }

        /* Vitufe vya Mishale (Arrows) */
        .bc-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: #ffffff;
            color: var(--text-dark);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: 0.3s;
            z-index: 10;
        }

        .bc-arrow:hover {
            background: var(--bc-pink);
            color: #ffffff;
        }

        .bc-prev { left: 20px; }
        .bc-next { right: 20px; }

        /* Sehemu ya Maelezo na Kitufe chini ya Slider */
        .bc-content-box {
            text-align: center;
            padding: 40px 20px;
            background: #ffffff;
        }

        .bc-content-box h2 {
            font-size: 1.8rem;
            color: var(--text-dark);
            margin-bottom: 20px;
            font-weight: normal;
        }

        .bc-btn {
            display: inline-block;
            background-color: var(--bc-purple);
            color: #ffffff;
            padding: 12px 35px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .bc-btn:hover {
            background-color: var(--bc-pink);
        }
    </style>
</head>
<body>

    <!-- ENEO LA SLIDER YA JUU -->
    <div class="bc-hero-container">
        
        <!-- Vidoti vya juu kulia -->
        <div class="bc-dots-top">
            <span class="bc-dot active" onclick="currentSlide(1)"></span>
            <span class="bc-dot" onclick="currentSlide(2)"></span>
            <span class="bc-dot" onclick="currentSlide(3)"></span>
            <span class="bc-dot" onclick="currentSlide(4)"></span>
            <span class="bc-dot" onclick="currentSlide(5)"></span>
            <span class="bc-dot" onclick="currentSlide(6)"></span>
            <span class="bc-dot" onclick="currentSlide(7)"></span>
        </div>

        <!-- 1. Beach & Ocean Experiences -->
        <div class="bc-slide active">
            <img src="beach-ocean.jpg" alt="Beach & Ocean" onerror="this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80'">
        </div>

        <!-- 2. Culture & History -->
        <div class="bc-slide">
            <img src="culture-history.jpg" alt="Culture & History" onerror="this.src='https://images.unsplash.com/photo-1547471080-7cc2caa01a7e?auto=format&fit=crop&w=1200&q=80'">
        </div>

        <!-- 3. Wildlife & Safari -->
        <div class="bc-slide">
            <img src="wildlife-safari.jpg" alt="Wildlife & Safari" onerror="this.src='https://images.unsplash.com/photo-1516426122078-c23e76319801?auto=format&fit=crop&w=1200&q=80'">
        </div>

        <!-- 4. Luxury & VIP Services -->
        <div class="bc-slide">
            <img src="luxury-vip.jpg" alt="Luxury & VIP" onerror="this.src='https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1200&q=80'">
        </div>

        <!-- 5. Travel Support Services -->
        <div class="bc-slide">
            <img src="travel-support.jpg" alt="Travel Support" onerror="this.src='https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1200&q=80'">
        </div>

        <!-- 6. Events & Special Occasions -->
        <div class="bc-slide">
            <img src="events-occasions.jpg" alt="Events" onerror="this.src='https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=1200&q=80'">
        </div>

        <!-- 7. Nature & Adventure -->
        <div class="bc-slide">
            <img src="nature-adventure.jpg" alt="Nature & Adventure" onerror="this.src='https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80'">
        </div>

        <!-- Mishale ya Kusogeza (Kushoto na Kulia) -->
        <button class="bc-arrow bc-prev" onclick="moveSlide(-1)">❮</button>
        <button class="bc-arrow bc-next" onclick="moveSlide(1)">❯</button>
    </div>

    <!-- Maelezo na Kitufe Chini ya Slider -->
    <div class="bc-content-box">
        <h2 id="bc-title">Beach & Ocean Experiences</h2>
        <a href="#" class="bc-btn">Find out more</a>
    </div>

    <script>
        let slideIndex = 1;
        const titles = [
            "Beach & Ocean Experiences",
            "Culture & History",
            "Wildlife & Safari",
            "Luxury & VIP Services",
            "Travel Support Services",
            "Events & Special Occasions",
            "Nature & Adventure"
        ];

        showSlide(slideIndex);

        function moveSlide(n) {
            showSlide(slideIndex += n);
        }

        function currentSlide(n) {
            showSlide(slideIndex = n);
        }

        function showSlide(n) {
            let slides = document.getElementsByClassName("bc-slide");
            let dots = document.getElementsByClassName("bc-dot");
            let titleElem = document.getElementById("bc-title");

            if (n > slides.length) { slideIndex = 1; }
            if (n < 1) { slideIndex = slides.length; }

            for (let i = 0; i < slides.length; i++) {
                slides[i].classList.remove("active");
                dots[i].classList.remove("active");
            }

            slides[slideIndex - 1].classList.add("active");
            dots[slideIndex - 1].classList.add("active");
            titleElem.textContent = titles[slideIndex - 1];
        }
    </script>
</body>
            </html>
