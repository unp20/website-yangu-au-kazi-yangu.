<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Reviews | UNP TOURS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<meta name="robots" content="noindex, nofollow">
<style>
body { font-family: 'Poppins', sans-serif; background: #f8f9fa; padding: 20px; color: #333; }
.container { max-width: 1100px; margin: 0 auto; }
.header { background: linear-gradient(135deg, #082f49, #0c4a6e); color: #fff; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; border-bottom: 5px solid #d4af37; }
.header h1 { color: #d4af37; margin-bottom: 10px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
.stat { background: #fff; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,0.05); border-top: 4px solid #d4af37; }
.stat h3 { font-size: 1.8rem; color: #0c4a6e; margin-bottom: 5px; }
.stat p { font-size: 0.85rem; color: #777; }
.box { background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
.box h2 { color: #0c4a6e; margin-bottom: 15px; }
.review-item { background: #f9f9f9; padding: 20px; border-radius: 10px; border-left: 4px solid #d4af37; margin-bottom: 15px; }
.review-item .stars { color: #d4af37; font-size: 1.1rem; margin-bottom: 8px; }
.review-item .text { color: #555; font-size: 0.9rem; line-height: 1.7; margin-bottom: 8px; font-style: italic; }
.review-item .author { color: #082f49; font-weight: 700; font-size: 0.9rem; }
.review-item .service { color: #777; font-size: 0.8rem; }
.btn { background: #d4af37; color: #082f49; padding: 10px 20px; border: none; border-radius: 25px; font-weight: 700; cursor: pointer; font-size: 0.9rem; margin-bottom: 15px; }
.btn:hover { background: #082f49; color: #d4af37; }
#loading { text-align: center; padding: 20px; color: #777; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-star"></i> Admin — Reviews</h1>
        <p>Angalia reviews zote kutoka Firebase Firestore</p>
    </div>

    <div class="stats">
        <div class="stat"><h3 id="totalReviews">0</h3><p>Reviews Zote</p></div>
        <div class="stat"><h3 id="avgRating">0</h3><p>Wastani wa Nyota</p></div>
        <div class="stat"><h3 id="fiveStars">0</h3><p>Nyota 5</p></div>
    </div>

    <div class="box">
        <h2><i class="fas fa-list"></i> Reviews Zote</h2>
        <button class="btn" onclick="loadReviews()"><i class="fas fa-sync"></i> Refresh</button>
        <div id="loading">Inapakia...</div>
        <div id="reviewsList"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyD2YtPFL2L_ZwAKdSYpXtvLt8gJUm2IX6s",
    authDomain: "unptours.firebaseapp.com",
    projectId: "unptours",
    storageBucket: "unptours.firebasestorage.app",
    messagingSenderId: "233326851661",
    appId: "1:233326851661:web:354156110a5cee29904e04"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.loadReviews = async function() {
    const loading = document.getElementById('loading');
    const list = document.getElementById('reviewsList');
    loading.style.display = 'block';
    list.innerHTML = '';

    try {
        const snap = await getDocs(collection(db, "reviews"));
        let total = 0, sumRating = 0, fiveStars = 0;

        snap.forEach((doc) => {
            const d = doc.data();
            total++;
            sumRating += (d.rating || 0);
            if (d.rating === 5) fiveStars++;

            const stars = '★'.repeat(d.rating || 0) + '☆'.repeat(5 - (d.rating || 0));

            list.innerHTML += `
                <div class="review-item">
                    <div class="stars">${stars} (${d.rating || 0}/5)</div>
                    <div class="text">"${d.message || ''}"</div>
                    <div class="author">— ${d.name || 'Mteja'}</div>
                    <div class="service">${d.service || ''}</div>
                </div>
            `;
        });

        document.getElementById('totalReviews').textContent = total;
        document.getElementById('avgRating').textContent = total > 0 ? (sumRating / total).toFixed(1) : '0';
        document.getElementById('fiveStars').textContent = fiveStars;

        loading.style.display = 'none';

        if (total === 0) {
            loading.textContent = 'Hakuna reviews bado.';
            loading.style.display = 'block';
        }
    } catch (e) {
        loading.textContent = 'Kosa: ' + e.message;
    }
};

window.addEventListener('load', loadReviews);
</script>
</body>
                                       </html>
