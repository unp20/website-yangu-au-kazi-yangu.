<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soul Voyara — Journey Beyond Horizons</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.85)), url('https://images.unsplash.com/photo-1590523277543-a94d2e4eb00b?w=1920&q=80') center/cover no-repeat fixed;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: #ffffff;
    }

    .login-container {
        background: rgba(15, 20, 30, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(212, 160, 23, 0.3);
        border-radius: 24px;
        padding: 45px 35px;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 60px rgba(212, 160, 23, 0.1);
        text-align: center;
        animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .logo-circle {
        width: 90px;
        height: 90px;
        margin: 0 auto 25px;
        background: linear-gradient(135deg, #d4a017, #f5d76e);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 42px;
        box-shadow: 0 10px 30px rgba(212, 160, 23, 0.4);
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 10px 30px rgba(212, 160, 23, 0.4); }
        50% { transform: scale(1.05); box-shadow: 0 15px 40px rgba(212, 160, 23, 0.6); }
    }

    h1 {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 3px;
        color: #ffffff;
        margin-bottom: 8px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }
    h1 span { color: #d4a017; }

    .tagline {
        font-size: 12px;
        color: #b0b8c4;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 40px;
        font-weight: 500;
    }

    .input-group {
        text-align: left;
        margin-bottom: 22px;
        position: relative;
    }
    .input-group label {
        display: block;
        font-size: 12px;
        color: #d4a017;
        margin-bottom: 8px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
    }
    .input-group input {
        width: 100%;
        padding: 15px 18px 15px 45px;
        background: rgba(0, 0, 0, 0.4);
        border: 1.5px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: #ffffff;
        font-size: 15px;
        outline: none;
        transition: all 0.3s ease;
    }
    .input-group input:focus {
        border-color: #d4a017;
        background: rgba(0, 0, 0, 0.6);
        box-shadow: 0 0 0 4px rgba(212, 160, 23, 0.15);
    }
    .input-group input::placeholder { color: #6b7280; }

    .input-icon {
        position: absolute;
        left: 15px;
        top: 42px;
        font-size: 18px;
        color: #d4a017;
    }

    .login-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #d4a017, #b88a10);
        border: none;
        border-radius: 12px;
        color: #0f141e;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 2px;
        cursor: pointer;
        margin-top: 15px;
        transition: all 0.3s ease;
        box-shadow: 0 8px 25px rgba(212, 160, 23, 0.35);
        text-transform: uppercase;
    }
    .login-btn:hover {
        background: linear-gradient(135deg, #f5d76e, #d4a017);
        transform: translateY(-3px);
        box-shadow: 0 12px 35px rgba(212, 160, 23, 0.55);
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 15px;
        margin: 25px 0;
    }
    .divider::before, .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
    }
    .divider span {
        font-size: 11px;
        color: #6b7280;
        font-weight: 600;
        letter-spacing: 1px;
    }

    .social-login {
        display: flex;
        gap: 12px;
        margin-bottom: 25px;
    }
    .social-btn {
        flex: 1;
        padding: 12px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        color: #ffffff;
        font-size: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    .social-btn:hover {
        background: rgba(212, 160, 23, 0.15);
        border-color: #d4a017;
        transform: translateY(-2px);
    }

    .signup-link {
        font-size: 14px;
        color: #9ca3af;
    }
    .signup-link a {
        color: #d4a017;
        text-decoration: none;
        font-weight: 700;
        transition: color 0.3s;
    }
    .signup-link a:hover { color: #f5d76e; }

    .footer-text {
        margin-top: 30px;
        font-size: 10px;
        color: #4b5563;
        letter-spacing: 2px;
        text-transform: uppercase;
    }
</style>
</head>
<body>

<div class="login-container">
    <div class="logo-circle">✨</div>
    <h1>SOUL <span>VOYARA</span></h1>
    <p class="tagline">Journey Beyond Horizons</p>

    <form id="loginForm">
        <div class="input-group">
            <label for="email">EMAIL ADDRESS</label>
            <span class="input-icon">📧</span>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="input-group">
            <label for="password">PASSWORD</label>
            <span class="input-icon">🔒</span>
            <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" class="login-btn">Login to Journey</button>
    </form>

    <div class="divider">
        <span>OR CONTINUE WITH</span>
    </div>

    <div class="social-login">
        <button class="social-btn" title="Google">🔵</button>
        <button class="social-btn" title="Facebook">📘</button>
        <button class="social-btn" title="Apple">🍎</button>
    </div>

    <p class="signup-link">
        Don't have an account? <a href="#">Sign up here</a>
    </p>
    <p class="footer-text">© 2026 SOUL VOYARA — All Rights Reserved</p>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const btn = document.querySelector('.login-btn');
    const originalText = btn.innerText;

    if (email) {
        btn.innerText = '⏳ Loading...';
        btn.style.opacity = '0.7';

        setTimeout(() => {
            alert('Welcome to Soul Voyara, ' + email + '! 🌍');
            btn.innerText = originalText;
            btn.style.opacity = '1';
        }, 1000);
    }
});
</script>

</body>
            </html>
