<body>

  <div class="flex items-center gap-4">

</nav>

<!-- ================= HERO ================= -->
<section class="pt-32 pb-16 bg-gradient-to-br from-[#0c4a6e] to-[#082f49] text-white border-b-4 border-[#d4a017]">
  <div class="max-w-4xl mx-auto text-center px-5">
    <div class="text-6xl mb-4">🌴</div>
    <h1 class="text-4xl md:text-6xl font-extrabold mb-4">All Services & Excursions</h1>
    <p class="text-lg md:text-xl text-blue-200">Choose your experience from our complete list of 10-Star Luxury services.</p>
  </div>
</section>

<!-- ================= CONTENT ================= -->
<main class="max-w-6xl mx-auto px-5 py-16">

  <!-- FILTERS -->
  <div class="flex flex-wrap justify-center gap-3 mb-10">
    <button class="filter-btn active px-6 py-2 rounded-full font-bold bg-[#0c4a6e] text-white border-2 border-[#0c4a6e] transition" onclick="filterTrips('all', this)">All Services</button>
    <button class="filter-btn px-6 py-2 rounded-full font-bold bg-white text-[#0c4a6e] border-2 border-[#0c4a6e] hover:bg-[#0c4a6e] hover:text-white transition" onclick="filterTrips('Zanzibar', this)">Zanzibar</button>
    <button class="filter-btn px-6 py-2 rounded-full font-bold bg-white text-[#0c4a6e] border-2 border-[#0c4a6e] hover:bg-[#0c4a6e] hover:text-white transition" onclick="filterTrips('Safari', this)">Safari</button>
    <button class="filter-btn px-6 py-2 rounded-full font-bold bg-white text-[#0c4a6e] border-2 border-[#0c4a6e] hover:bg-[#0c4a6e] hover:text-white transition" onclick="filterTrips('Water Sports', this)">Water Sports</button>
    <button class="filter-btn px-6 py-2 rounded-full font-bold bg-white text-[#0c4a6e] border-2 border-[#0c4a6e] hover:bg-[#0c4a6e] hover:text-white transition" onclick="filterTrips('Luxury', this)">Luxury & VIP</button>
  </div>

  <!-- TRIPS GRID -->
  <div id="allTripsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    <p class="text-center col-span-full text-gray-500 py-12">Loading services from Firebase...</p>
  </div>

</main>

<!-- ================= FOOTER ================= -->
<footer class="bg-black text-gray-300 py-10 px-5 border-t-4 border-[#d4a017]">

  </div>
</footer>

<a href="https://wa.me/255655728982" target="_blank" class="fixed bottom-6 right-6 w-14 h-14 bg-[#25D366] rounded-full flex justify-center items-center text-3xl text-white shadow-lg hover:scale-110 transition z-50">
  💬

<!-- ================= FIREBASE SDK ================= -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCe5-MZMASwDZtIN3zfLvwlrn0U2ObC17s",
    authDomain: "soul-unp-tour.firebaseapp.com",
    projectId: "soul-unp-tour",
    storageBucket: "soul-unp-tour.firebasestorage.app",
    messagingSenderId: "503119437259",
    appId: "1:503119437259:web:aaa65be89a8d77d5abaa4e",
    measurementId: "G-EC65GSRRKM"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let allTripsData = [];

  async function fetchAllTrips() {
      const container = document.getElementById('allTripsContainer');
      try {
          const snapshot = await getDocs(collection(db, "trips"));
          if(snapshot.empty) {
              container.innerHTML = '<p class="text-center col-span-full text-gray-500 py-12">No trips available at the moment.</p>';
              return;
          }
          allTripsData = [];
          snapshot.forEach(doc => {
              allTripsData.push(doc.data());
          });
          displayTrips(allTripsData);
      } catch (err) {
          console.error(err);
          container.innerHTML = '<p class="text-center col-span-full text-red-500 py-12">Failed to load data from Firebase.</p>';
      }
  }

  function displayTrips(trips) {
      const container = document.getElementById('allTripsContainer');
      container.innerHTML = '';
      
      if(trips.length === 0) {
          container.innerHTML = '<p class="text-center col-span-full text-gray-500 py-12">No services found for this category.</p>';
          return;
      }

      trips.forEach(t => {
          container.innerHTML += `
              <div class="trip-card bg-white rounded-2xl overflow-hidden shadow-lg border-t-4 border-[#d4a017] flex flex-col">
                  <div class="h-56 overflow-hidden">
                      <img src="${t.image || 'assets/images/nungwi-beach-paradise.jpg'}" alt="${t.name}" class="w-full h-full object-cover transition duration-500 hover:scale-110">
                  </div>
                  <div class="p-6 flex-grow flex flex-col">
                      <h3 class="text-xl font-bold text-[#082f49] mb-2">${t.name}</h3>
                      <p class="text-gray-600 text-sm mb-4 flex-grow">${t.description || 'Experience a unique adventure with UNP Tours.'}</p>
                      <p class="text-sm text-[#0c4a6e] font-semibold mb-4">📍 ${t.location || 'Zanzibar'}</p>
                      <div class="flex justify-between items-center pt-4 border-t border-gray-100 mt-auto">
                          <span class="text-2xl font-extrabold text-[#d4a017]">From $${t.priceBudget || 50}</span>
                          <a href="booking.html?trip=${encodeURIComponent(t.name)}" class="bg-[#0c4a6e] text-white px-5 py-2 rounded-xl font-bold text-sm hover:bg-[#082f49] transition">Book Now →</a>
                      </div>
                  </div>
              </div>
          `;
      });
  }

  window.filterTrips = function(category, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('bg-[#0c4a6e]', 'text-white');
          b.classList.add('bg-white', 'text-[#0c4a6e]');
      });
      btn.classList.remove('bg-white', 'text-[#0c4a6e]');
      btn.classList.add('bg-[#0c4a6e]', 'text-white');

      if(category === 'all') {
          displayTrips(allTripsData);
      } else {
          const filtered = allTripsData.filter(t => t.category && t.category.toLowerCase().includes(category.toLowerCase()));
          displayTrips(filtered);
      }
  };

  window.addEventListener('load', fetchAllTrips);
</script>

</body>
    </html>
