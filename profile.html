<!-- ================= PROFILE HEADER ================= -->
<section class="pt-32 pb-12 bg-gradient-to-br from-[#0c4a6e] to-[#082f49] text-white border-b-4 border-[#d4a017]">
  <div class="max-w-4xl mx-auto px-5 text-center">
    <div id="avatarInitials" class="w-24 h-24 bg-[#d4a017] text-[#082f49] rounded-full flex items-center justify-center text-4xl font-extrabold mx-auto mb-4 border-4 border-white shadow-lg">...</div>
    <h1 id="profileName" class="text-3xl font-extrabold mb-2">Loading...</h1>
    <p id="profileEmail" class="text-blue-200 text-sm">📧 ...</p>
    <p id="profilePhone" class="text-blue-200 text-sm mt-1">📱 ...</p>
    
    <!-- Tabs -->
    <div class="flex flex-wrap justify-center gap-3 mt-6">
      <button onclick="showTab('bookings', event)" class="tab-btn active bg-[#d4a017] text-[#082f49] px-6 py-2 rounded-full font-bold transition">📅 My Bookings</button>
      <button onclick="showTab('settings', event)" class="tab-btn bg-white/10 border border-[#d4a017] text-white px-6 py-2 rounded-full font-bold hover:bg-[#d4a017] hover:text-[#082f49] transition">⚙️ Settings</button>
      <button onclick="logout()" class="bg-red-500 text-white px-6 py-2 rounded-full font-bold hover:bg-red-600 transition">🚪 Logout</button>
    </div>
  </div>
</section>

<!-- ================= CONTENT ================= -->
<main class="max-w-3xl mx-auto px-5 py-12">

  <!-- Tab: Bookings -->
  <section class="tab-content active bg-white rounded-2xl p-8 shadow-lg border-l-4 border-[#0c4a6e]" id="tab-bookings">
    <h2 class="text-2xl font-extrabold text-[#082f49] mb-6">My Safari History</h2>
    <div id="bookingsList" class="space-y-4">
      <p class="text-center text-gray-500">Loading your bookings...</p>
    </div>
    <div class="text-center mt-8">
      <a href="booking.html" class="inline-block bg-[#0c4a6e] text-white px-8 py-3 rounded-full font-bold hover:bg-[#082f49] transition">+ Book New Trip</a>
    </div>
  </section>

  <!-- Tab: Settings -->
  <section class="tab-content bg-white rounded-2xl p-8 shadow-lg border-l-4 border-[#d4a017]" id="tab-settings">
    <h2 class="text-2xl font-extrabold text-[#082f49] mb-6">Edit My Information</h2>
    <form id="settingsForm" class="space-y-5">
      <div>
        <label class="block text-sm font-semibold text-[#082f49] mb-2">Full Name</label>
        <input type="text" id="editName" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none focus:border-[#d4a017] transition">
      </div>
      <div>
        <label class="block text-sm font-semibold text-[#082f49] mb-2">Email (Cannot be changed)</label>
        <input type="email" id="editEmail" required disabled class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl bg-gray-100 text-gray-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold text-[#082f49] mb-2">Phone Number</label>
        <input type="tel" id="editPhone" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none focus:border-[#d4a017] transition">
      </div>
      <button type="submit" class="w-full bg-[#d4a017] text-[#082f49] py-4 rounded-xl font-bold hover:bg-[#b88a10] transition">Save Changes</button>
    </form>
  </section>

</main>

<!-- ================= JAVASCRIPT (FIREBASE) ================= -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, updateDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCe5-MZMASwDZtIN3zfLvwlrn0U2ObC17s",
    authDomain: "soul-unp-tour.firebaseapp.com",
    projectId: "soul-unp-tour",
    storageBucket: "soul-unp-tour.firebasestorage.app",
    messagingSenderId: "503119437259",
    appId: "1:503119437259:web:aaa65be89a8d77d5abaa4e",
    measurementId: "G-EC65GSRRKM"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUserId = null;
  let currentUserEmail = null;

  onAuthStateChanged(auth, async (user) => {
      if (user) {
          currentUserId = user.uid;
          currentUserEmail = user.email;

          // Tafuta kwenye collection "customers" kwa kuwa ndio tuliyotumia kwenye signup
          const docRef = doc(db, "customers", user.uid);
          const docSnap = await getDoc(docRef);

          if (docSnap.exists()) {
              const data = docSnap.data();
              document.getElementById('profileName').textContent = data.name || "User";
              document.getElementById('profileEmail').innerHTML = '📧 ' + (data.email || user.email);
              document.getElementById('profilePhone').innerHTML = '📱 ' + (data.phone || "Not set");

              document.getElementById('editName').value = data.name || "";
              document.getElementById('editEmail').value = data.email || user.email;
              document.getElementById('editPhone').value = data.phone || "";

              const initials = (data.name || "U").split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
              document.getElementById('avatarInitials').textContent = initials;
          }

          loadUserBookings(user.email);
      } else {
          window.location.href = "login.html";
      }
  });

  async function loadUserBookings(email) {
      const container = document.getElementById('bookingsList');
      try {
          const q = query(collection(db, "bookings"), where("customer_email", "==", email));
          const snap = await getDocs(q);

          if (snap.empty) {
              container.innerHTML = '<p class="text-center text-gray-500">No bookings yet. Book your first trip!</p>';
              return;
          }

          container.innerHTML = '';
          snap.forEach((doc) => {
              const d = doc.data();
              const cls = (d.status === 'confirmed' || d.status === 'paid') ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700';
              container.innerHTML += `
                  <div class="flex justify-between items-center p-4 bg-gray-50 rounded-xl border-l-4 border-[#0c4a6e]">
                      <div>
                          <h4 class="font-bold text-[#082f49]">${d.service_name || 'Safari'}</h4>
                          <p class="text-sm text-gray-500">📅 ${d.date || '-'} | 👥 ${d.guests || '-'} guests</p>
                      </div>
                      <span class="px-3 py-1 rounded-full text-xs font-bold ${cls}">${d.status || 'pending'}</span>
                  </div>
              `;
          });
      } catch (error) {
          console.error("Error loading bookings:", error);
          container.innerHTML = '<p class="text-center text-red-500">Error loading bookings.</p>';
      }
  }

  window.showTab = function(tabName, event) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.classList.remove('bg-[#d4a017]', 'text-[#082f49]');
          btn.classList.add('bg-white/10', 'text-white');
      });
      
      document.getElementById('tab-' + tabName).classList.add('active');
      if(event) {
          event.target.classList.remove('bg-white/10', 'text-white');
          event.target.classList.add('bg-[#d4a017]', 'text-[#082f49]');
      }
  };

  window.logout = async function() {
      if (confirm("Are you sure you want to logout?")) {
          await signOut(auth);
          window.location.href = "login.html";
      }
  };

  const settingsForm = document.getElementById('settingsForm');
  settingsForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUserId) return;

      const newName = document.getElementById('editName').value;
      const newPhone = document.getElementById('editPhone').value;

      try {
          const userRef = doc(db, "customers", currentUserId);
          await updateDoc(userRef, {
              name: newName,
              phone: newPhone
          });
          alert("Your information has been saved successfully!");
          document.getElementById('profileName').textContent = newName;
          const initials = newName.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
          document.getElementById('avatarInitials').textContent = initials;
      } catch (error) {
          alert("Error: " + error.message);
      }
  });
</script>

</body>
            </html>
