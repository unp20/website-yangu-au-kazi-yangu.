<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingia | UNP Tours</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
    .auth-container {
        max-width: 420px;
        margin: 120px auto 60px;
        padding: 40px 30px;
        background: #ffffff;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .auth-container h2 {
        text-align: center;
        color: #1a3c34;
        margin-bottom: 10px;
    }
    .auth-container p.subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
        font-size: 0.9rem;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
        font-size: 0.9rem;
    }
    .form-group input {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
        font-family: 'Poppins', sans-serif;
        box-sizing: border-box;
    }
    .form-group input:focus {
        outline: none;
        border-color: #c5a059;
    }
    .btn-auth {
        width: 100%;
        padding: 14px;
        background: #1a3c34;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        font-family: 'Poppins', sans-serif;
        transition: background 0.3s;
    }
    .btn-auth:hover {
        background: #c5a059;
        color: #1a3c34;
    }
    .auth-links {
        text-align: center;
        margin-top: 20px;
        font-size: 0.9rem;
    }
    .auth-links a {
        color: #c5a059;
        text-decoration: none;
        font-weight: 600;
    }
    .alert-box {
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: center;
        font-size: 0.9rem;
        display: none;
    }
    .alert-error {
        background-color: #f8d7da;
        color: #721c24;
        display: block;
    }
</style>
</head>
<body>

<!-- Header rahisi -->
<header class="header" style="position: fixed; top: 0; width: 100%; z-index: 1000;">
<div class="nav-container" style="justify-content: center;">
<a href="index.html" class="logo-area">
<div class="logo-text">
<h2>UNP TOURS</h2>
<span>Unique & Natural Paradise</span>
</div>
</a>
</div>
</header>

<div class="auth-container">
    <h2>Karibu Tena</h2>
    <p class="subtitle">Ingia kwenye akaunti yako ili kuendelea.</p>

    <div id="messageBox" class="alert-box"></div>

    <form id="loginForm">
        <div class="form-group">
            <label for="email">Barua Pepe (Email)</label>
            <input type="email" id="email" placeholder="mfano@barua.com" required>
        </div>
        <div class="form-group">
            <label for="password">Neno la Siri</label>
            <input type="password" id="password" placeholder="Weka neno la siri" required>
        </div>
        <button type="submit" class="btn-auth" id="loginBtn">Ingia</button>
    </form>

    <div class="auth-links">
        Huna akaunti bado? <a href="signup.html">Jiunge Hapa</a>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD2YtPFL2L_ZwAKdSYpXtvLt8gJUm2IX6s",
    authDomain: "unptours.firebaseapp.com",
    projectId: "unptours",
    storageBucket: "unptours.firebasestorage.app",
    messagingSenderId: "233326851661",
    appId: "1:233326851661:web:354156110a5cee29904e04",
    measurementId: "G-5QJ1X38ZLC"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);

  const loginForm = document.getElementById('loginForm');
  const messageBox = document.getElementById('messageBox');
  const loginBtn = document.getElementById('loginBtn');

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    loginBtn.disabled = true;
    loginBtn.textContent = "Inaingia...";

    try {
        await signInWithEmailAndPassword(auth, email, password);
        messageBox.textContent = "Karibu! Unaelekezwa...";
        messageBox.className = "alert-box alert-success";
        setTimeout(() => {
            window.location.href = "index.html";
        }, 2000);
    } catch (error) {
        console.error("Error: ", error);
        let errorMsg = "Barua pepe au neno la siri si sahihi.";
        if (error.code === 'auth/user-not-found') {
            errorMsg = "Mtumiaji hajapatikana. Tafadhali jisajili kwanza.";
        }
        messageBox.textContent = errorMsg;
        messageBox.className = "alert-box alert-error";
        loginBtn.disabled = false;
        loginBtn.textContent = "Ingia";
    }
  });
</script>

</body>
  </html>
