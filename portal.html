<style>
:root { 
    --ocean-blue: #0c4a6e; 
    --deep-navy: #082f49; 
    --gold: #d4af37; 
    --gold-light: #f0c75e; 
    --light-bg: #f8f9fa; 
    --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
body { background-color: var(--light-bg); color: #333; line-height: 1.6; overflow-x: hidden; }
a { text-decoration: none; color: inherit; }

/* Enterprise Header */
.header { background: var(--deep-navy); padding: 15px 30px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.3); border-bottom: 2px solid var(--gold); }
.nav-container { max-width: 1300px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
.logo-area { display: flex; align-items: center; gap: 15px; cursor: pointer; }
.logo-holder { width: 50px; height: 50px; border: 2px solid var(--gold); border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(212, 175, 55, 0.1); }
.logo-fallback { color: var(--gold); font-weight: 700; font-size: 0.65rem; text-align: center; }
.logo-text h2 { color: #fff; font-size: 1.2rem; font-weight: 700; }
.logo-text span { color: var(--gold); font-size: 0.75rem; display: block; }

.nav-links { display: flex; gap: 25px; list-style: none; align-items: center; }
.nav-links button { background: none; border: none; color: #fff; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 8px 15px; border-radius: 8px; transition: var(--transition); }
.nav-links button:hover, .nav-links button.active { background: var(--ocean-blue); color: var(--gold); border: 1px solid var(--gold); }

/* Dynamic Viewport Container */
.app-viewport { max-width: 1300px; margin: 30px auto; min-height: 70vh; padding: 0 20px; animation: fadeIn 0.5s ease-in-out; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Enterprise Hero & Ads Banner Integration */
.hero-section { background: linear-gradient(135deg, var(--deep-navy), var(--ocean-blue)); color: #fff; padding: 60px 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: grid; grid-template-columns: 2fr 1fr; gap: 30px; align-items: center; position: relative; overflow: hidden; border-left: 8px solid var(--gold); }
.hero-content h1 { font-size: 2.5rem; color: var(--gold); margin-bottom: 15px; }
.hero-content p { font-size: 1.05rem; color: #ddd; margin-bottom: 25px; }
.btn-gold { background: var(--gold); color: var(--deep-navy); padding: 12px 30px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: var(--transition); display: inline-flex; align-items: center; gap: 10px; }
.btn-gold:hover { background: var(--gold-light); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(212,175,55,0.4); }

/* High-End Dynamic Ad Banner Card (Umoja wa Matangazo ya Huduma) */
.promo-ad-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.3); padding: 25px; border-radius: 15px; backdrop-filter: blur(10px); text-align: center; position: relative; }
.promo-ad-card .ad-badge { position: absolute; top: 10px; right: 10px; background: var(--gold); color: var(--deep-navy); font-size: 0.65rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
.promo-ad-card h3 { color: var(--gold); font-size: 1.2rem; margin-bottom: 10px; }
.promo-ad-card p { font-size: 0.85rem; color: #eee; margin-bottom: 15px; }

/* Grid Layouts for Pages */
.grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
.card-item { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 4px solid var(--ocean-blue); transition: var(--transition); }
.card-item:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
.card-item h3 { color: var(--ocean-blue); margin-bottom: 10px; font-size: 1.2rem; }
.card-item p { color: #666; font-size: 0.9rem; }

/* Enterprise Footer */
.footer { background: var(--deep-navy); color: #fff; padding: 40px 20px; margin-top: 60px; border-top: 3px solid var(--gold); }
.footer-content { max-width: 1300px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
.footer p { font-size: 0.85rem; color: #aaa; }

/* Floating Quick Actions */
.floating-action { position: fixed; bottom: 30px; right: 30px; background: #25d366; color: #fff; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); z-index: 1100; transition: var(--transition); }
.floating-action:hover { transform: scale(1.1); }

@media(max-width: 768px) {
    .hero-section { grid-template-columns: 1fr; padding: 30px 20px; }
    .nav-links { display: none; } /* Inaweza kuwekwa mobile drawer kamili ya kimataifa */
}
</style>
