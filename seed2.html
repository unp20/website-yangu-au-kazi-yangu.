// === FUNCTION YA KUWEKA TRIPS ===
async function startSeed() {
  if (!db) {
    log.innerHTML += '<span class="err">❌ Firebase haiko tayari. Refresh ukurasa.</span>\n';
    return;
  }
  log.innerHTML += '<span class="info">\n🔄 Inaanza kuweka...\n</span>';
  let ok = 0, fail = 0;
  for (let i = 0; i < trips.length; i++) {
    try {
      await db.collection("trips").add(trips[i]);
      log.innerHTML += '<span class="ok">✅ ' + (i+1) + '. ' + trips[i].name + '</span>\n';
      ok++;
    } catch(e) {
      log.innerHTML += '<span class="err">❌ ' + (i+1) + '. ' + trips[i].name + ' — ' + e.message + '</span>\n';
      fail++;
    }
    log.scrollTop = log.scrollHeight;
  }
  log.innerHTML += '\n<span class="ok">🎉 JUMLA: ' + ok + ' zimewekwa, ' + fail + ' zimeshindwa</span>';
}

// === FUNGA KITUFE ===
document.getElementById('btnSeed').addEventListener('click', startSeed);
